<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OP Kortteli Lounas</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #222; }
    h1 { color: #c8322a; }
    .rss-link { background: #f4f4f4; padding: 12px 16px; border-radius: 6px; font-family: monospace; font-size: 14px; word-break: break-all; }
    .rss-link a { color: #c8322a; }
    footer { margin-top: 40px; font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <h1>🍽️ OP Kortteli Lounas RSS</h1>
  <p>Päivittäin klo 10.30 päivittyvä lounaslista:</p>
  <ul>
    <li>Pannu – Soupster OP Kortteli</li>
    <li>Kulho – Soupster OP Kortteli</li>
    <li>Uuni – Soupster OP Kortteli</li>
    <li>Antell Hella</li>
    <li>Antell Tori</li>
  </ul>
  <p><strong>RSS-feedin URL (liitä Teamsiin):</strong></p>
  <div class="rss-link">
    <a id="rss-url" href="lounas.xml">lounas.xml</a>
  </div>
  <script>
    // Näytä absoluuttinen URL
    document.getElementById("rss-url").href = location.origin + location.pathname.replace(/\/?$/, "/") + "lounas.xml";
    document.getElementById("rss-url").textContent = location.origin + location.pathname.replace(/\/?$/, "/") + "lounas.xml";
  </script>
  <footer>Päivitetty automaattisesti GitHub Actionsilla.</footer>
</body>
</html>
