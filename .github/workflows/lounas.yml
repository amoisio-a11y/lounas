name: Laheta lounasmenu sahkopostilla

on:
  repository_dispatch:
    types: [send-lunch]    # kaynnistyy HTTP-kutsulla cron-job.orgista
  workflow_dispatch:        # ja manuaalisesti GitHubin kayttoliittymasta

jobs:
  send-lunch-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Asenna Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Aja skripti ja laheta sahkoposti
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENTS:         ${{ secrets.RECIPIENTS }}
        run: python lounas_scraper.py
