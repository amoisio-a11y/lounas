name: Laheta lounasmenu sahkopostilla

on:
  schedule:
    - cron: "30 6 * * 1-5"   # 09:30 Helsinki (EEST = UTC+3)
                               # Tunnin puskuri GitHubin jonoviiveelle.
                               # GitHub lupaa kaynnistyksen 1h sisalla — viesti
                               # lahetetaan viimeistaan n. 10:30, yleensa n. 09:30-09:45.
  workflow_dispatch:

jobs:
  send-lunch-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Asenna Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Aja skripti ja laheta sahkoposti
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python lounas_scraper.py
