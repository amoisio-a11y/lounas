name: Päivitä lounasmenu

on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Asenna riippuvuudet
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Aja skripti
        run: python lounas_scraper.py
      - name: Commitoi päivitetty RSS
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lounas.xml lounas_history.json
          git diff --staged --quiet || git commit -m "🍽️ Lounas $(date +'%d.%m.%Y')"
          git push
