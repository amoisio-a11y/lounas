name: Laheta lounasmenu sahkopostilla

on:
  schedule:
    - cron: "30 7 * * 1-5"   # 10:30 Helsinki (EEST = UTC+3)
    - cron: "00 8 * * 1-5"   # 11:00 Helsinki — varmuusajo jos 10:30 viivastyi
  workflow_dispatch:

jobs:
  send-lunch-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Asenna Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Aja skripti ja laheta sahkoposti
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python lounas_scraper.py
