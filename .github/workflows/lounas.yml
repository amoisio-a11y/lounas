name: Lähetä lounasmenu sähköpostilla

on:
  schedule:
    - cron: "30 7 * * 1-5"   # klo 10:30 Helsinki (EEST = UTC+3)
  workflow_dispatch:          # manuaalinen ajo tarvittaessa

jobs:
  send-lunch-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Asenna Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Aja skripti ja lähetä sähköposti
        env:
          GMAIL_SENDER:       ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python lounas_scraper.py
